name: Backend CI & Database Validation

on:
  push:
    paths:
      - 'server/**'
      - 'supabase/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'supabase/**'

jobs:
  test-backend:
    name: Build Backend & Test PostgreSQL Schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: fodemep_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validar y Ejecutar Esquema Relacional FoDeMEEP
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d fodemep_test_db -f supabase/schema.sql
          PGPASSWORD=testpassword psql -h localhost -U postgres -d fodemep_test_db -f supabase/seed_completo_publicas.sql

      - name: Instalar Dependencias del Backend
        working-directory: ./server
        run: npm install

      - name: Compilar TypeScript Backend
        working-directory: ./server
        run: npm run build

      - name: Iniciar API y Test de Salud (Healthcheck)
        working-directory: ./server
        env:
          PORT: 3001
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/fodemep_test_db
        run: |
          node dist/index.js &
          sleep 3
          curl -f http://localhost:3001/api/health || exit 1
